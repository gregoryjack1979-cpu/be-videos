<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bathroom Excellence</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .logo { font-size: 2rem; font-weight: 800; color: #2196F3; margin-bottom: 0.5rem; text-align: center; }
  .tagline { color: #888; margin-bottom: 3rem; text-align: center; font-size: 0.95rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; width: 100%; max-width: 900px; }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: #2196F3; transform: translateY(-2px); }
  .card-thumb {
    background: #111;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }
  .card-body { padding: 1.25rem; }
  .card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.25rem; }
  .card-sub { color: #888; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="logo">🚿 Bathroom Excellence</div>
  <p class="tagline">bathroomexcellence.com · 636-795-4643</p>
  <div class="grid">
    <a class="card" href="/video1">
      <div class="card-thumb">🎬</div>
      <div class="card-body">
        <div class="card-title">Video 1</div>
        <div class="card-sub">Watch now →</div>
      </div>
    </a>
    <a class="card" href="/video2">
      <div class="card-thumb">🎬</div>
      <div class="card-body">
        <div class="card-title">Video 2 – Why It's Worth the Wait</div>
        <div class="card-sub">Watch now →</div>
      </div>
    </a>
    <a class="card" href="/video3">
      <div class="card-thumb">🎬</div>
      <div class="card-body">
        <div class="card-title">Video 3</div>
        <div class="card-sub">Watch now →</div>
      </div>
    </a>
  </div>
</body>
</html>
